/*
 * OLIBOT JaCaMo Build File
 *
 * Uses the Gradle wrapper (./gradlew) — no local Gradle install needed.
 *
 * First run downloads:
 *   - Gradle 8.10.2 (~180 MB, cached in ~/.gradle)
 *   - JaCaMo + dependencies (~80 MB, cached in ~/.gradle)
 *
 * Usage:
 *   ./gradlew run   → compile + start the JaCaMo agent on port 8080
 */
plugins {
    id 'java'
}

group = 'olibot'
version = '1.0'

// JaCaMo 1.3.0 requires Java 21.
// Make sure openjdk-21-jdk is installed:  sudo apt install openjdk-21-jdk
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url "https://raw.githubusercontent.com/jacamo-lang/mvn-repo/master" }
    maven { url "https://repo.gradle.org/gradle/libs-releases" }
    mavenCentral()
}

dependencies {
    // JaCaMo 1.3.0 — includes Jason (BDI), CArtAgO (env), Moise (org)
    implementation 'org.jacamo:jacamo:1.3.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/env']   // OlibotEnv.java
        }
        resources {
            srcDirs = ['src/agt']  // olibot.asl picked up at runtime by JaCaMo
        }
    }
}

task run(type: JavaExec, dependsOn: compileJava) {
    description = 'Start the OLIBOT JaCaMo BDI agent'
    group = 'application'

    mainClass = 'jacamo.infra.JaCaMoLauncher'
    classpath = sourceSets.main.runtimeClasspath
    args = ['olibot.jcm']
    workingDir = projectDir

    jvmArgs = [
        // In Java 9+, com.sun.net.httpserver is in jdk.httpserver, not java.base
        '--add-exports', 'jdk.httpserver/com.sun.net.httpserver=ALL-UNNAMED',
        '--add-opens',   'java.base/java.lang=ALL-UNNAMED',
        // Use console logging (not GUI window) so output appears in the terminal
        '-Djava.util.logging.config.file=logging.properties',
    ]

    // Stream output to terminal in real-time (Gradle buffers by default)
    standardOutput = System.out
    errorOutput    = System.err

    doFirst {
        mkdir 'log'
    }
}