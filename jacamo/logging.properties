# JaCaMo logging — Console output (no GUI window)
# Uses java.util.logging.ConsoleHandler so output goes to the terminal.
# Place this file in the jacamo/ directory; run.sh passes it via -Dfile.encoding.

handlers = java.util.logging.ConsoleHandler

.level = INFO

java.util.logging.ConsoleHandler.level     = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format   = [%1$tT] %4$s %3$s: %5$s%n

# Silence noisy third-party loggers
java.level   = OFF
javax.level  = OFF
sun.level    = OFF
jade.level   = OFF
io.vertx.level = WARNING
org.glassfish.level = WARNING